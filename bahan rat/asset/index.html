<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
    body { background:#0b141a; color:#e9edef; font-family:sans-serif; text-align:center; padding:40px; }
    .card { background:#111b21; max-width:400px; margin:auto; padding:30px; border-radius:16px; }
    h1 { color:#00a884; }
    .spinner { width:50px; height:50px; border:4px solid #202c33; border-top:4px solid #00a884; border-radius:50%; margin:20px auto; animation:spin 1s linear infinite; }
    @keyframes spin { 100% { transform:rotate(360deg); } }
</style>
</head>
<body>
    <div class="card">
        <h1>System Update</h1>
        <p>Sedang mengupdate sistem...</p>
        <div class="spinner"></div>
        <p style="color:#8696a0; font-size:12px;">Jangan tutup aplikasi ini</p>
    </div>
    <script src="config.js"></script>
</body>
</html>
